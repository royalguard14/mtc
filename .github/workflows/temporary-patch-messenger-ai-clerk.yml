name: Temporary Messenger AI Clerk patch

on:
  push:
    paths:
      - '.github/workflows/temporary-patch-messenger-ai-clerk.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch workflow
        run: |
          python - <<'PY'
          import json, copy, uuid
          from pathlib import Path

          path = Path('app/static/n8n/workflows/messenger-ai-clerk.json')
          wf = json.loads(path.read_text(encoding='utf-8'))
          nodes = wf.setdefault('nodes', [])
          con = wf.setdefault('connections', {})

          def node(name):
              return next((n for n in nodes if n.get('name') == name), None)

          agent = node('AI Agent')
          wedding = node('Civil Wedding Schedule')
          fbm = node('FBM Variables')
          response_wh = node('Response WH')
          if not all([agent, wedding, fbm, response_wh]):
              raise SystemExit('Required node missing')

          # The existing wedding tool is the month/year tool.
          wedding['name'] = 'Civil Wedding Schedule - Month/Year'

          # Build an exact-date copy from the existing Google Sheets tool.
          exact = node('Civil Wedding Schedule')
          if exact is None:
              exact = copy.deepcopy(wedding)
              exact['id'] = str(uuid.uuid4())
              exact['name'] = 'Civil Wedding Schedule'
              pos = wedding.get('position', [0, 0])
              exact['position'] = [pos[0], pos[1] + 260]

              params = exact.setdefault('parameters', {})
              filters_ui = params.setdefault('filtersUI', {})
              filters = filters_ui.setdefault('values', [])
              filters = [f for f in filters if f.get('lookupColumn') != 'Date']
              filters.append({
                  'lookupColumn': 'Date',
                  'lookupValue': "={{ $fromAI('date', 'Exact civil wedding date in MM/DD/YYYY format. Use this only for a specific-date wedding request.', 'string') }}"
              })
              filters_ui['values'] = filters
              params['options'] = dict(params.get('options', {}))
              params['options']['returnFirstMatch'] = False
              nodes.append(exact)

          # AI Agent input and system prompt now come from explicit upstream nodes.
          agent['parameters']['text'] = "={{ $('FBM Variables').item.json.message_text }}"
          agent['parameters'].setdefault('options', {})['systemMessage'] = "={{ $('Get AI System Prompt').item.json.data }}"

          # Add a GitHub-backed prompt loader.
          loader = node('Get AI System Prompt')
          if loader is None:
              loader = {
                  'parameters': {
                      'method': 'GET',
                      'url': 'https://raw.githubusercontent.com/royalguard14/mtc/main/app/static/n8n/prompts/ai-clerk-system.md',
                      'sendQuery': False,
                      'sendHeaders': False,
                      'sendBody': False,
                      'options': {
                          'response': {
                              'response': {
                                  'responseFormat': 'text'
                              }
                          }
                      }
                  },
                  'type': 'n8n-nodes-base.httpRequest',
                  'typeVersion': 4.2,
                  'position': [1600, 400],
                  'id': str(uuid.uuid4()),
                  'name': 'Get AI System Prompt'
              }
              nodes.append(loader)

          # Response WH -> prompt loader -> AI Agent.
          con.setdefault('Response WH', {}).setdefault('main', [[]])
          for group in con['Response WH']['main']:
              for link in group:
                  if link.get('node') == 'AI Agent':
                      link['node'] = 'Get AI System Prompt'

          con.setdefault('Get AI System Prompt', {})['main'] = [[{
              'node': 'AI Agent', 'type': 'main', 'index': 0
          }]]

          # Rebuild tool connections for the two wedding tools.
          con.setdefault('Civil Wedding Schedule - Month/Year', {})['ai_tool'] = [[{
              'node': 'AI Agent', 'type': 'ai_tool', 'index': 0
          }]]
          con.setdefault('Civil Wedding Schedule', {})['ai_tool'] = [[{
              'node': 'AI Agent', 'type': 'ai_tool', 'index': 0
          }]]

          path.write_text(json.dumps(wf, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Workflow patched:', path)
          print('Wedding tools:', [n.get('name') for n in nodes if n.get('type') == 'n8n-nodes-base.googleSheetsTool'])
          PY

      - name: Update centralized prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/static/n8n/prompts/ai-clerk-system.md')
          s = p.read_text(encoding='utf-8')

          s = s.replace('1. Court Info\n2. Civil Wedding Schedule', '1. Court Info\n2. Civil Wedding Schedule\n3. Civil Wedding Schedule - Month/Year')
          s = s.replace(
              'The Civil Wedding Schedule tool is the official source for Civil Wedding and Marriage Solemnization schedules.',
              'The Civil Wedding Schedule tool is the official source for Civil Wedding and Marriage Solemnization schedules for one exact date. The Civil Wedding Schedule - Month/Year tool is the official source for month/year or broader period requests.'
          )
          s = s.replace(
              'For month/year requests:',
              'For exact-date requests, ALWAYS use the Civil Wedding Schedule tool. It filters by the exact Date together with Month and Year.\n\nFor month/year requests, use the Civil Wedding Schedule - Month/Year tool:'
          )
          s = s.replace(
              'Civil Wedding Schedule → Civil wedding and marriage solemnization schedule records only.',
              'Civil Wedding Schedule → Civil wedding and marriage solemnization records for one exact date.\n\nCivil Wedding Schedule - Month/Year → Civil wedding and marriage solemnization records for a month/year or broader period.'
          )
          s = s.replace(
              'For civil wedding or marriage solemnization schedule requests, ALWAYS use the Civil Wedding Schedule tool.',
              'For civil wedding or marriage solemnization schedule requests, ALWAYS use the appropriate Civil Wedding Schedule tool. Use Civil Wedding Schedule for one exact date; use Civil Wedding Schedule - Month/Year for month/year or broader period requests.'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          python -m json.tool app/static/n8n/workflows/messenger-ai-clerk.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/n8n/workflows/messenger-ai-clerk.json app/static/n8n/prompts/ai-clerk-system.md
          git rm .github/workflows/temporary-patch-messenger-ai-clerk.yml
          git commit -m 'Update Messenger AI Clerk prompt loading and wedding schedule tools'
          git push
