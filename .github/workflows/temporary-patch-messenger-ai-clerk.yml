name: Temporary Messenger AI Clerk patch

on:
  push:
    paths:
      - '.github/workflows/temporary-patch-messenger-ai-clerk.yml'

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect workflow nodes
        run: |
          python - <<'PY'
          import json
          p='app/static/n8n/workflows/messenger-ai-clerk.json'
          w=json.load(open(p,encoding='utf-8'))
          print('=== NODE INVENTORY ===')
          for n in w.get('nodes',[]):
              print('NAME:',repr(n.get('name')))
              print('TYPE:',n.get('type'))
              print('PARAM_KEYS:',list(n.get('parameters',{}).keys()))
              print('PARAMS:',json.dumps(n.get('parameters',{}),ensure_ascii=False)[:2500])
              print('---')
          print('=== CONNECTIONS ===')
          print(json.dumps(w.get('connections',{}),ensure_ascii=False,indent=2)[:12000])
          raise SystemExit(1)
          PY
