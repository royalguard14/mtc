{% extends "layouts/layout1.html" %}

{% block content %}
<section class="col-lg-12 connectedSortable">
	<div class="card card-primary">
		<div class="card-header">
			<h3 class="card-title">Document Generator</h3>
		</div>

		<div class="card-body">
			<button type="button" class="btn btn-success" onclick="printHelloWorld()">
				<i class="fas fa-print"></i> Print Hello World
			</button>
		</div>
	</div>
</section>
{% endblock %}
