<!DOCTYPE html>
<html>
<head>
  <title>Court Schedule</title>


<style>
  
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 20px;
}

h1 {
  color: #2c3e50;
}

.card {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.today {
  border-left: 6px solid green;
}

.future {
  border-left: 6px solid blue;
}


</style>








</head>
<body>

<h1>Court Schedule Dashboard</h1>

<div id="today"></div>
<div id="future"></div>



<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxfsQOvTi5ZP51bKn_N8RqX3K39Mufrwh9w2AEG69LI0lJBS_0Erpu8Fhfg9V_oubtw/exec?api=schedule";

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    render(data);
  });

function render(data) {
  const todayDiv = document.getElementById("today");
  const futureDiv = document.getElementById("future");

  const today = new Date();
  today.setHours(0,0,0,0);

  data.forEach(item => {
    const itemDate = new Date(item.Date);
    itemDate.setHours(0,0,0,0);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${item["Case Type"]}</b><br>
      ${item.Date} - ${item["Time Start"]}<br>
      ${item.Title}
    `;

    if (itemDate.getTime() === today.getTime()) {
      div.classList.add("today");
      todayDiv.appendChild(div);
    } else if (itemDate > today) {
      div.classList.add("future");
      futureDiv.appendChild(div);
    }
  });
}
</script>






</body>
</html>
