<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTC-Buenavista ADN</title>

  <!-- Google Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap4.min.css">

  <style>
  
.small-box {
  min-height: 120px;
  position: relative;
  overflow: hidden;
}


.small-box .inner {
  padding: 10px;
  height: 100%;
  overflow: hidden;
}



.small-box .inner {
  width: 100%;
}

/* THIS FIXES LONG TEXT */
.card-title-text {
  font-size: 14px;
  font-weight: 600;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
  text-overflow: ellipsis;

  line-height: 1.3em;
  max-height: 2.6em;

  word-break: break-word;
}
  </style>
</head>

<body class="hold-transition layout-top-nav">

<div class="wrapper">

  <!-- NAVBAR -->
  <nav class="main-header navbar navbar-expand-md navbar-light navbar-white">
    <div class="container">
      <a href="#" class="navbar-brand">
        <span class="brand-text font-weight-light">Court Schedule System</span>
      </a>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content-wrapper">

    <div class="content-header">
      <div class="container">
        <h1>Munincipal Trial Court Buenavista ADN</h1>
        <small>Today & Upcoming Hearings</small>
      </div>
    </div>

    <div class="content">
      <div class="container">

        <!-- TODAY SECTION -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Today's Hearings</h3>
          </div>
          <div class="card-body">
            <div id="today" class="row"></div>
          </div>
        </div>

        <!-- FUTURE TABLE -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Upcoming Hearings</h3>
          </div>

          <div class="card-body">
            <table id="example2" class="table table-bordered table-hover">
              <thead>
                <tr>
                  <th>Case Type</th>
                  <th>Date</th>
                  <th>Start</th>
                  <th>Case Number</th>
                  <th>Title</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="futureBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>

  </div>

</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxfsQOvTi5ZP51bKn_N8RqX3K39Mufrwh9w2AEG69LI0lJBS_0Erpu8Fhfg9V_oubtw/exec?api=schedule";

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    console.log("DATA:", data);
    render(data);
  });

/* SAFE DATE PARSER */
function parseDate(d) {
  if (!d) return null;

  const parts = d.split("/").map(Number);
  if (parts.length !== 3) return null;

  const month = parts[0] - 1;
  const day = parts[1];
  const year = parts[2];

  const date = new Date(year, month, day);

  return isNaN(date.getTime()) ? null : date;
}

function render(data) {
  const todayDiv = document.getElementById("today");
  const futureBody = document.getElementById("futureBody");

  todayDiv.innerHTML = "";
  futureBody.innerHTML = "";

  const today = new Date();
  today.setHours(0,0,0,0);

data.forEach(item => {

  // SKIP DONE
  if ((item.Status || "").toLowerCase() === "done") {
    return;
  }

  const itemDate = parseDate(item.Date);
  if (!itemDate) return;

  itemDate.setHours(0,0,0,0);

  /* TODAY */
  if (itemDate.getTime() === today.getTime()) {

    const col = document.createElement("div");
    col.className = "col-md-4";

    const color = getBoxColor(item["Case Type"]);

    col.innerHTML = `
      <div class="small-box ${color}">
        <div class="inner">
          <h5>${item["Case Type"]}</h5>
          <div class="card-title-text">${item.Title}</div>
          <p><b>${item["Time Start"]}</b></p>
        </div>
      </div>
    `;

    todayDiv.appendChild(col);
  }

  /* FUTURE ONLY */
  if (itemDate.getTime() > today.getTime()) {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${item["Case Type"]}</td>
      <td>${formatDate(itemDate)}</td>
      <td>${item["Time Start"]}</td>
      <td>${item["Case Number"]}</td>
      <td>${item.Title}</td>
      <td>${item.Notes || ''}</td>
    `;

    futureBody.appendChild(tr);
  }
});

  /* FIX DataTable REINIT */
  if ($.fn.DataTable.isDataTable('#example2')) {
    $('#example2').DataTable().destroy();
  }

  $('#example2').DataTable({
    responsive: true,
    paging: true,
    searching: true,
    ordering: true,
    info: true
  });
}

/* FORMAT: May 12, 2026 */
function formatDate(date) {
  return date.toLocaleDateString('en-US', {
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });
}
</script>

<script>
  function getBoxColor(caseType) {
  caseType = (caseType || "").toLowerCase();

  if (caseType.includes("wedding")) return "bg-success";   // green
  if (caseType.includes("criminal")) return "bg-danger";   // red
  if (caseType.includes("civil")) return "bg-warning";     // yellow

  return "bg-info"; // default (blue)
}
</script>

</body>
</html>
