{% extends "layouts/layout1.html" %}

{% block content %}


  <style>
  
.small-box {
  min-height: 120px;
  position: relative;
  overflow: hidden;
}


.small-box .inner {
  padding: 10px;
  height: 100%;
  overflow: hidden;
}



.small-box .inner {
  width: 100%;
}

/* THIS FIXES LONG TEXT */
.card-title-text {
  font-size: 14px;
  font-weight: 600;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
  text-overflow: ellipsis;

  line-height: 1.3em;
  max-height: 2.6em;

  word-break: break-word;
}
  </style>



<section class="col-lg-7 connectedSortable">
         <div class="card">
          <div class="card-header">
            <h3 class="card-title">Today's Wedding</h3>
          </div>
          <div class="card-body">
            <div id="today" class="row"></div>
          </div>
        </div>
</section>

<section class="col-lg-5 connectedSortable">
        <!-- FUTURE TABLE -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Upcoming Wedding</h3>
          </div>

          <div class="card-body">
               <table id="example2" class="table table-bordered table-hover">
              <thead>
                <tr>
           
                  <th>Date</th>
                  <th>Start</th>
                 <th>Wedding Number</th>
                </tr>
              </thead>
              <tbody id="futureBody"></tbody>
            </table>
          </div>
        </div>
</section>
{% endblock %}

{% block scripts %}

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxfsQOvTi5ZP51bKn_N8RqX3K39Mufrwh9w2AEG69LI0lJBS_0Erpu8Fhfg9V_oubtw/exec?api=schedule";

fetch(API_URL)
  .then(res => res.json())
  .then(data => render(data));

function parseDate(d) {
  if (!d) return null;
  const parts = d.split("/").map(Number);
  if (parts.length !== 3) return null;

  return new Date(parts[2], parts[0] - 1, parts[1]);
}

function timeToSortable(timeStr) {
  if (!timeStr) return "00:00";
  const d = new Date("1970-01-01 " + timeStr);
  if (isNaN(d)) return "00:00";

  return d.getHours().toString().padStart(2,'0') + ":" +
         d.getMinutes().toString().padStart(2,'0');
}

function render(data) {

  console.log(data);

  const todayDiv = document.getElementById("today");
  const futureBody = document.getElementById("futureBody");

  todayDiv.innerHTML = "";
  futureBody.innerHTML = "";

  const today = new Date();
  today.setHours(0,0,0,0);

  // =========================
  // FILTER ONLY WEDDING
  // =========================
  const filtered = data.filter(item =>
    (item["Case Type"] || "").toLowerCase().includes("wedding")
  );

  filtered.forEach(item => {

    if ((item.Status || "").toLowerCase() === "done") return;

    const itemDate = parseDate(item.Date);
    if (!itemDate) return;

    itemDate.setHours(0,0,0,0);

    // =========================
    // TODAY WEDDINGS
    // =========================
    if (itemDate.getTime() === today.getTime()) {

      const col = document.createElement("div");
      col.className = "col-md-4";

      const boxColor = getBoxColor(item["Case Type"]);

      col.innerHTML = `
        <div class="small-box ${boxColor}">
          <div class="inner">
            <h5>${(item["Case Type"] || "").toUpperCase()} # ${item["Case Number"]}</h5>
            <div class="card-title-text">${item.Title}</div>
            <p><b>${item["Time Start"]}</b></p>
          </div>
        </div>
      `;

      todayDiv.appendChild(col);
    }

    // =========================
    // FUTURE WEDDINGS TABLE
    // =========================
    if (itemDate.getTime() > today.getTime()) {

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td data-order="${itemDate.getTime()}">
          ${formatDate(itemDate)}
        </td>
        <td data-order="${timeToSortable(item["Time Start"])}">
          ${item["Time Start"]}
        </td>
        <td>${item["Case Number"]}</td>
      `;

      futureBody.appendChild(tr);
    }
  });

  // =========================
  // DATATABLE REINIT
  // =========================
  if ($.fn.DataTable.isDataTable('#example2')) {
    $('#example2').DataTable().destroy();
  }

  $('#example2').DataTable({
    responsive: true,
    paging: true,
    searching: true,
    ordering: true,
    info: true,
    pageLength: 5,
    order: [
      [0, 'asc'],
      [1, 'asc']
    ]
  });
}

function formatDate(date) {
  return date.toLocaleDateString('en-US', {
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });
}

function getBoxColor(caseType) {
  caseType = (caseType || "").toLowerCase();

  if (caseType.includes("wedding")) return "bg-success";
  if (caseType.includes("criminal case")) return "bg-danger";
  if (caseType.includes("civil case")) return "bg-warning";

  return "bg-info";
}
</script>
{% endblock %}
