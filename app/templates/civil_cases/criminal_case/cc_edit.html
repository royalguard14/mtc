{% extends "layouts/layout1.html" %}
{% block content %}

<section class="col-lg-12 connectedSortable">

  <div class="card">

    <div class="card-header">
      <h3 class="card-title">
        Edit Criminal Case
      </h3>
    </div>

    <form method="POST">

      <div class="card-body">

        <div class="form-group">
          <label>Case Number</label>
          <input type="text"
                 name="CASENUM"
                 class="form-control"
                 value="{{ case.CASENUM }}">
        </div>

        <div class="form-group">
          <label>Case Title</label>
          <input type="text"
                 name="CASETITLE"
                 class="form-control"
                 value="{{ case.CASETITLE }}">
        </div>

        <div class="form-group">
          <label>Date Filed</label>
          <input type="date"
                 name="DTFILED"
                 class="form-control"
                 value="{{ case.DTFILED }}">
        </div>

        <div class="form-group">
          <label>Date Received</label>
          <input type="date"
                 name="DTRECEIVED"
                 class="form-control"
                 value="{{ case.DTRECEIVED }}">
        </div>

        <div class="form-group">
          <label>Nature</label>
          <textarea name="NATUREREM"
                    class="form-control"
                    rows="3">{{ case.NATUREREM }}</textarea>
        </div>

      </div>

      <div class="card-footer">

        <button type="submit"
                class="btn btn-primary">
          <i class="fas fa-save"></i>
          Update
        </button>

        <a href="/cc"
           class="btn btn-default">
          Cancel
        </a>

      </div>

    </form>

  </div>

</section>

{% endblock %}
